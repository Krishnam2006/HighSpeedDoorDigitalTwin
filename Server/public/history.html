<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Door History</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,Arial,sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            padding:30px;
        }

        h1{
            color:#22d3ee;
            margin-bottom:20px;
        }

        .history-tools{

            display:flex;
            gap:15px;
            align-items:center;
            margin:20px 0;
            flex-wrap:wrap;

        }

        .history-tools input,
        .history-tools select{

            padding:10px 14px;
            border:none;
            border-radius:8px;
            font-size:16px;

        }

        button{

            padding:10px 20px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            background:#22d3ee;
            color:#0f172a;
            font-weight:bold;
            transition:.25s;

        }

        button:hover{

            background:#67e8f9;

        }

        table{

            width:100%;
            border-collapse:collapse;
            margin-top:20px;

        }

        th{

            background:#22d3ee;
            color:black;
            padding:12px;

        }

        td{

            background:#1e293b;
            padding:12px;
            text-align:center;
            border-bottom:1px solid #334155;

        }

    </style>

</head>

<body>

<h1>📊 Door History</h1>

<button onclick="location.href='/'">
← Back Dashboard
</button>

<div class="history-tools">

    <input
        id="searchBox"
        type="text"
        placeholder="Search Controller..."
    >

    <select id="limitSelect">

        <option value="20">20 Records</option>
        <option value="50" selected>50 Records</option>
        <option value="100">100 Records</option>
        <option value="500">500 Records</option>

    </select>

    <button onclick="loadHistory()">
        Refresh
    </button>

<button onclick="window.location='/api/export'">
⬇ Download CSV
</button>

</div>

<table id="historyTable">

    <thead>

        <tr>

            <th>Time</th>
            <th>Controller</th>
            <th>Mode</th>
            <th>Safety</th>
            <th>Cycle</th>
            <th>Position</th>
            <th>Fault</th>

        </tr>

    </thead>

    <tbody>

    </tbody>

</table>

<script src="history.js"></script>

</body>

</html>
